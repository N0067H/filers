[package]
name = "filers"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3.1", features = ["postgres", "r2d2", "chrono", "uuid"] }
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
serial_test = "3.2"
tower = { version = "0.5", features = ["util"] }
